# Static export with trailingSlash: true, so every route is a directory
# with an index.html. Mirrors the Next.js static-exports guide.
server {
  listen 80;
  root /usr/share/nginx/html;

  location / {
    try_files $uri $uri.html $uri/ =404;
  }

  error_page 404 /404.html;
  location = /404.html {
    internal;
  }
}
